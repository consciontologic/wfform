# Dart package name; the Android application ID and iOS bundle ID are
# configured separately as com.wfform in their platform projects.
name: wfform
description: Discover free OpenRouter AI models and chat with streaming responses, local conversation history, and supported file attachments.
homepage: https://wfform.com/
repository: https://github.com/consciontologic/wfform
issue_tracker: https://github.com/consciontologic/wfform/issues
topics:
  - openrouter
  - ai-chat
  - flutter
  - pwa
  - markdown
publish_to: none
version: 1.0.0
environment:
  sdk: ^3.10.9
  # Includes Flutter's Android web keyboard-dismissal engine fix (3.38.6).
  flutter: '>=3.38.10'
dependencies:
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  highlight: ^0.7.0
  http: ^1.6.0
  markdown: ^7.3.0
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - docs/tools.md
    - docs/wfformcomp.md
    - assets/fonts/Roboto_LICENSE.txt
    - assets/fonts/RobotoMono_LICENSE.txt
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
