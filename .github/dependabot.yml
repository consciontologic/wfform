version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pub
    directory: /
    target-branch: develop
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      dart:
        patterns: ['*']
  - package-ecosystem: pub
    directory: /companion
    target-branch: develop
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
