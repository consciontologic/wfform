name: 🛡️ Free security and package reports

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, 'feature/**', 'bugfix/**', 'hotfix/**', 'release/**']
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 🧰 Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: false
      - name: 🔒 Resolve locked dependencies
        run: |
          flutter pub get --enforce-lockfile
          dart pub get --offline --enforce-lockfile -C companion
      - name: 🕵️ Check secrets with the free Gitleaks CLI
        run: |
          mkdir -p .local/security build/reports
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output .local/security/gitleaks.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' '.local/security/gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf .local/security/gitleaks.tar.gz -C .local/security gitleaks
          .local/security/gitleaks git --redact --report-format sarif --report-path build/reports/gitleaks.sarif .
      - name: 📦 OSV vulnerabilities, locked dependency inventory and SBOM
        if: ${{ !cancelled() }}
        run: bash tool/ci-step.sh '🛡️ Public package security' make security.report
      - name: 🌈 Audit GitHub Actions with free zizmor
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@27d989be9329e6cff7f80baf450ca83bf4c94898 # reviewed 2026-10-09
        with:
          version: '1.30.1'
          advanced-security: false
          annotations: true
          online-audits: false
          color: true
      - name: 📊 Retain machine-readable security and package reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports
          path: build/reports
          if-no-files-found: warn
      - name: 📝 Security summary
        if: always()
        env:
          CHECK_STATUS: ${{ job.status }}
        run: |
          printf '## 🛡️ Security and packages\n\nStatus: **%s**\n\n🕵️ Gitleaks · 📦 OSV · 🌈 zizmor · 📋 CycloneDX inventory\n\nAll scanners are free and open source. No paid dashboard or license token is used.\n' "$CHECK_STATUS" >> "$GITHUB_STEP_SUMMARY"
          if test -f build/reports/security-summary.md; then cat build/reports/security-summary.md >> "$GITHUB_STEP_SUMMARY"; fi
