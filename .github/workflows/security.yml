name: 🛡️ Free security and package reports

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: wfform-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    # Other main PRs are skipped without allocating a quality runner.
    if: >-
      github.event_name == 'pull_request' && (
        github.base_ref == 'develop' || (github.base_ref == 'main' && (
          startsWith(github.head_ref, 'hotfix/') ||
          startsWith(github.head_ref, 'codex/hotfix/') ||
          startsWith(github.head_ref, 'claude/hotfix/') ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           startsWith(github.head_ref, 'copilot/') &&
           contains(github.event.pull_request.labels.*.name, 'work:hotfix'))
        )))
    name: Security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The run's head SHA must identify the exact source checked here.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: 🧰 Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
          pub-cache: true
          # Covers both packages; the action also appends all pubspec.lock hashes.
          pub-cache-key: wfform-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('pubspec.lock', 'companion/pubspec.lock') }}
      - name: 🔒 Resolve locked dependencies
        run: |
          flutter pub get --enforce-lockfile
          dart pub get --offline --enforce-lockfile -C companion
      - name: ♻️ Cache checksum-verified scanner downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/security-downloads
            ${{ runner.temp }}/security-pip-cache
          key: ${{ runner.os }}-${{ runner.arch }}-security-downloads-gitleaks-8.30.1-zizmor-1.30.1-v1
      - name: 🕵️ Check secrets with the free Gitleaks CLI
        run: |
          mkdir -p "$RUNNER_TEMP/security-downloads" "$RUNNER_TEMP/security-bin" build/reports
          archive="$RUNNER_TEMP/security-downloads/gitleaks_8.30.1_linux_x64.tar.gz"
          if ! test -f "$archive"; then
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
              --output "$archive"
          fi
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/security-bin" gitleaks
          "$RUNNER_TEMP/security-bin/gitleaks" git --redact --report-format sarif --report-path build/reports/gitleaks.sarif .
      - name: 📦 OSV vulnerabilities, locked dependency inventory and SBOM
        if: ${{ !cancelled() }}
        run: bash tool/ci-step.sh '🛡️ Public package security' make security.report
      - name: 🌈 Audit GitHub Actions with free zizmor
        if: ${{ !cancelled() }}
        # The pinned action downloads wheels with --require-hashes on every run.
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/security-pip-cache
        uses: zizmorcore/zizmor-action@27d989be9329e6cff7f80baf450ca83bf4c94898 # reviewed 2026-10-09
        with:
          version: '1.30.1'
          advanced-security: false
          annotations: true
          online-audits: false
          color: true
      - name: 📊 Retain machine-readable security and package reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports
          path: build/reports
          if-no-files-found: warn
      - name: 📝 Security summary
        if: always()
        env:
          CHECK_STATUS: ${{ job.status }}
        run: |
          printf '## 🛡️ Security and packages\n\nStatus: **%s**\n\n🕵️ Gitleaks · 📦 OSV · 🌈 zizmor · 📋 CycloneDX inventory\n\nAll scanners are free and open source. No paid dashboard or license token is used.\n' "$CHECK_STATUS" >> "$GITHUB_STEP_SUMMARY"
          if test -f build/reports/security-summary.md; then cat build/reports/security-summary.md >> "$GITHUB_STEP_SUMMARY"; fi
