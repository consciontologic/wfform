name: 🤖 Routine delivery

# workflow_run is metadata-only: immutable current-head checks are queried via
# GitHub API. No PR checkout, artifacts, scripts, caches or event shell text run.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ['🌐 Web quality', '🛡️ Free security and package reports', '📦 Packages and release']
    types: [completed]
  issues:
    types: [labeled]
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: Reconcile routine delivery or request one Copilot task
        type: choice
        options: [reconcile, delegate]
        default: reconcile
      issue_number:
        description: Existing issue number, required for delegate
        type: string
      work_kind:
        description: Gitflow lane for delegate
        type: choice
        options: [feature, bugfix, hotfix, release]
        default: feature
      release_version:
        description: Plain MAJOR.MINOR.PATCH, required for release delegation
        type: string

permissions: {}

# Serialize reservations and PR creation. Never cancel an in-flight task POST.
concurrency:
  group: wfform-delivery
  cancel-in-progress: false

jobs:
  delivery:
    name: Routine delivery controller
    if: >-
      github.repository == 'consciontologic/wfform' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'issues' || startsWith(github.event.label.name, 'ai:'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Configure this environment to allow main only. The durable user credential
    # is optional and used for requested Copilot tasks and routine PR creation.
    environment: automation
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: read
    steps:
      - name: 📥 Check out trusted controller only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            .github/delivery-policy.json
            .github/copilot-model-policy.json
            xops/agent
          sparse-checkout-cone-mode: false
      - name: 🔑 Optional application identity for routine PR delivery
        id: delivery-app
        if: ${{ vars.WFFORM_DELIVERY_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.WFFORM_DELIVERY_APP_ID }}
          private-key: ${{ secrets.WFFORM_DELIVERY_APP_PRIVATE_KEY }}
          owner: consciontologic
          repositories: wfform
          permission-contents: write
          permission-pull-requests: write
      - name: 🌿 Reconcile checks, reviews, PRs and release preparation
        # Durable user/App identity creates PRs, updates work branches and arms
        # native auto-merge so resulting CI starts normally. GITHUB_TOKEN owns
        # metadata receipts and release dispatch, never approval of production.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WFFORM_AUTOMATION_TOKEN: ${{ secrets.WFFORM_AUTOMATION_TOKEN }}
          WFFORM_DELIVERY_TOKEN: ${{ steps.delivery-app.outputs.token }}
        run: python3 xops/agent/delivery.py
      - name: 📝 Delivery summary
        if: always()
        env:
          CHECK_STATUS: ${{ job.status }}
        run: |
          printf '## 🤖 Routine delivery\n\nStatus: **%s**\n\n🌿 Native auto-merge preserves required reviews and checks.\n\n👤 Final release requires an eligible human production deployment approval.\n\n💰 One task and at most one diagnosed CI repair use the explicit model per issue; durable receipts prevent repeat submissions.\n' "$CHECK_STATUS" >> "$GITHUB_STEP_SUMMARY"
