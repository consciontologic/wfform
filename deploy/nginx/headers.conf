# This file is included once at server scope; locations add no headers, so
# nginx's standard inheritance also covers cache responses and errors.
add_header Content-Security-Policy "default-src 'none'; base-uri 'self'; script-src 'self' 'wasm-unsafe-eval'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com/s/; connect-src 'self' https://openrouter.ai https://fonts.gstatic.com/s/; worker-src 'self' blob:; media-src 'self' data: blob:; manifest-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=(), clipboard-read=(self), clipboard-write=(self)" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
add_header Strict-Transport-Security $hsts always;
add_header Cache-Control $asset_cache always;
