# This file is included once at server scope; locations add no headers, so
# nginx's standard inheritance also covers cache responses and errors.
add_header Content-Security-Policy "default-src 'none'; base-uri 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.googletagmanager.com 'sha256-eT57Z1ypzgtV4l0KJ9uVPW8NoWW0r07qRLOWTCZONMo=' 'sha256-ceOprgawj2RQrm546DhERntcne7eurN77Kn5b5l2zns='; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.googletagmanager.com https://*.google-analytics.com; font-src 'self' data: https://fonts.gstatic.com/s/; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; worker-src 'self' blob:; media-src 'self' data: blob:; manifest-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=(), clipboard-read=(self), clipboard-write=(self)" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
add_header Strict-Transport-Security $hsts always;
add_header Cache-Control $asset_cache always;
