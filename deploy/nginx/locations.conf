root /usr/share/nginx/html;
index index.html;
autoindex off;
include /etc/nginx/headers.conf;
# A static application has no write endpoints; no proxy_pass is configured.
if ($request_method !~ ^(GET|HEAD)$) { return 405; }
location = /healthz { default_type text/plain; return 200 "ok\n"; }
# Optional explicit runtime mount only. It is never copied into the image.
location = /config/local.json { alias /run/wfform/local.json; access_log off; }
location /config/ { return 404; }
location ~ /\. { return 404; }
location ~ \.map$ { return 404; }
# Asset misses must stay 404: returning index.html could poison a PWA install.
location / { try_files $uri $uri/ =404; }
