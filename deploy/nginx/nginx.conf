worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Do not record request/query strings, headers or runtime configuration.
    log_format safe '$remote_addr [$time_local] $request_method $status $body_bytes_sent';
    access_log /dev/stdout safe;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm text/css image/svg+xml;
    map "$status:$uri" $asset_cache {
        default "no-store";
    }
    map $scheme $hsts {
        default "";
        https "max-age=86400";
    }
    include /etc/nginx/server.conf;
    include /etc/nginx/tls-active/*.conf;
}
